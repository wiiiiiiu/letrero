<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Letrero LED</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Interfaz de configuración -->
  <div id="config">
    <label>Texto:</label>
    <input type="text" id="texto" value="Bienvenido a mi letrero LED">

    <label>Modo de color:</label>
    <select id="modo">
      <option value="mono">Monocromático</option>
      <option value="multi">Multicolor</option>
    </select>

    <label>Color principal:</label>
    <input type="color" id="color" value="#ff0000">

    <label>Cantidad de colores (solo multicolor):</label>
    <input type="number" id="cantidad" value="3" min="2" max="10">

    <label>Velocidad (segundos por ciclo):</label>
    <input type="number" id="velocidad" value="10" min="2" max="30">

    <button id="start">Start</button>
  </div>

  <!-- Letrero LED -->
  <div id="led">
    <span id="scroll" class="scroll"></span>
  </div>

  <script src="script.js"></script>
</body>
</html>
